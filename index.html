<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- style-src includes the SHA-256 of the empty string: Plotly appends an empty <style> element and fills it through CSSOM insertRule. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Belly Button Biodiversity — interactive dashboard</title>
<meta name="description" content="Interactive dashboard over the Belly Button Biodiversity dataset: per-subject top OTUs, bubble and pie charts, wash-frequency gauge, and computed diversity indices with cohort percentiles. By Freddrick Logan.">
<meta name="author" content="Freddrick Logan">
<link rel="canonical" href="https://freddricklogan.github.io/belly-button-challenge/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1220'/%3E%3Ccircle cx='12' cy='13' r='5' fill='%2358a6ff'/%3E%3Ccircle cx='21' cy='19' r='4' fill='%233fb950'/%3E%3Ccircle cx='20' cy='9' r='2.5' fill='%23d29922'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="src/exec-shell.css">
<link rel="stylesheet" href="src/app.css">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@4.1.1/plotly-basic.min.js"
        integrity="sha384-N2HZsG+IG/3J8CwhGGYz/kmzZ0sprpPWwjhor9ZI4lxuf47i9DXK2/NDGxMaJiEb"
        crossorigin="anonymous"></script>
</head>
<body>
<main id="demo-root" class="exec-main">
  <div id="chart-notice" class="notice" hidden>Plotly unavailable — statistics, metadata and the gauge still work.</div>
  <div class="layout">
    <aside class="stack">
      <section class="panel" aria-labelledby="h-subject">
        <h2 id="h-subject">Test subject</h2>
        <div class="field"><label for="selDataset">Subject ID</label><select id="selDataset"></select></div>
        <p class="method" id="top-otu">—</p>
      </section>
      <section class="panel" aria-labelledby="h-meta">
        <h2 id="h-meta">Demographic info</h2>
        <dl class="meta" id="meta"></dl>
      </section>
      <section class="panel" aria-labelledby="h-gauge">
        <h2 id="h-gauge">Wash frequency</h2>
        <svg class="gauge" id="gauge" viewBox="0 0 200 110" role="img" aria-labelledby="h-gauge gauge-note"></svg>
        <p class="method" id="gauge-note">—</p>
      </section>
    </aside>
    <div class="stack">
      <section class="stat-grid" id="stats" aria-label="Sample statistics">
        <div class="stat stat--accent"><div class="label">Total reads</div><div class="value" id="k-reads">—</div></div>
        <div class="stat stat--ok"><div class="label">Richness (OTUs)</div><div class="value" id="k-rich">—</div><div class="sub" id="k-rich-sub"></div></div>
        <div class="stat stat--warn"><div class="label">Shannon H′</div><div class="value" id="k-shannon">—</div><div class="sub" id="k-shannon-sub"></div></div>
        <div class="stat"><div class="label">Simpson 1−D</div><div class="value" id="k-simpson">—</div></div>
        <div class="stat"><div class="label">Top OTU share</div><div class="value" id="k-top">—</div></div>
      </section>
      <section class="panel"><h3>Top 10 OTUs</h3><div class="plot" id="bar" role="img" aria-label="Horizontal bar chart of the ten most abundant OTUs"></div></section>
      <section class="panel"><h3>All OTUs by ID and reads</h3><div class="plot plot--tall" id="bubble" role="img" aria-label="Bubble chart of every OTU in the sample"></div></section>
      <section class="panel"><h3>Top 5 share</h3><div class="plot" id="pie" role="img" aria-label="Pie chart of the five most abundant OTUs"></div></section>
      <p class="method" id="source-note">—</p>
    </div>
  </div>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
